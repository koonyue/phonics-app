<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌈 Phonics Fun — 拼音練習</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
  background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ff9a9e 100%);
  min-height: 100vh;
  padding: 20px;
}
.container { max-width: 900px; margin: 0 auto; }
h1 { text-align: center; font-size: 2.5em; color: #6b35b3; text-shadow: 2px 2px 0 #ffd700; margin-bottom: 10px; }
.subtitle { text-align: center; font-size: 1.2em; color: #555; margin-bottom: 20px; }
.section { background: rgba(255,255,255,0.9); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
.section h2 { color: #e84393; margin-bottom: 15px; font-size: 1.5em; }

.letter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 10px; }
.letter-btn { aspect-ratio: 1; border: 3px solid #ddd; border-radius: 15px; background: linear-gradient(145deg, #fff, #f0f0f0); font-size: 1.6em; font-weight: bold; color: #333; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
.letter-btn:hover { transform: scale(1.1); border-color: #ff6b6b; }
.letter-btn:active { transform: scale(0.95); background: #ffeaa7; }
.letter-btn.playing { background: #ffd700; border-color: #ff6b6b; transform: scale(1.15); }
.letter-btn.vowel { background: linear-gradient(145deg, #ffe0f0, #ffd0e0); color: #e84393; }

.input-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.word-input { flex: 1; min-width: 200px; padding: 14px 18px; font-size: 1.5em; border: 3px solid #a29bfe; border-radius: 14px; outline: none; text-align: center; text-transform: uppercase; letter-spacing: 3px; }
.speak-btn { padding: 14px 32px; background: #00b894; color: white; border: none; border-radius: 14px; font-size: 1.3em; font-weight: bold; cursor: pointer; transition: all 0.15s; box-shadow: 0 3px 8px rgba(0,0,0,0.15); }
.speak-btn:hover { background: #00a381; transform: scale(1.05); }
.speak-btn:active { background: #008966; transform: scale(0.95); }

.status { text-align: center; color: #888; font-size: 0.9em; margin-top: 8px; min-height: 20px; }
</style>
</head>
<body>
<div class="container">

<h1>🌈 Phonics Fun</h1>
<p class="subtitle">真人字母發音 · UK男聲讀全字 <span style="color:#aaa;font-size:0.65em;">v9.0</span></p>

<!-- Letter Grid — user's real recordings -->
<div class="section">
  <h2>🔤 字母發音 (真人)</h2>
  <div class="letter-grid" id="letterGrid"></div>
  <div class="status" id="letterStatus"></div>
</div>

<!-- Word Reading — Web Speech API UK male -->
<div class="section">
  <h2>📖 讀字 (🇬🇧 英國男聲)</h2>
  <div class="input-row">
    <input type="text" class="word-input" id="wordInput" placeholder="輸入英文詞語, e.g. CAT" maxlength="30">
    <button class="speak-btn" id="speakBtn">🔊 讀字</button>
  </div>
  <div class="status" id="wordStatus"></div>
</div>

</div>

<script>
const vowels = new Set(['A','E','I','O','U']);
let ukVoice = null;

// ─── Load best UK male voice ──────────────────────
function findUKVoice() {
  const voices = speechSynthesis.getVoices();
  // Prefer UK male
  ukVoice = voices.find(v => v.lang.startsWith('en-GB') && v.name.toLowerCase().includes('male'))
         || voices.find(v => v.lang.startsWith('en-GB'))
         || voices.find(v => v.lang === 'en-US' && v.name.toLowerCase().includes('male'))
         || null;
}
findUKVoice();
speechSynthesis.onvoiceschanged = findUKVoice;

// ─── Letter Grid ───────────────────────────────────
const letterGrid = document.getElementById('letterGrid');
const letterStatus = document.getElementById('letterStatus');

for (let i = 0; i < 26; i++) {
  const letter = String.fromCharCode(65 + i);
  const btn = document.createElement('button');
  btn.className = 'letter-btn' + (vowels.has(letter) ? ' vowel' : '');
  btn.textContent = letter;
  btn.addEventListener('click', () => {
    document.querySelectorAll('.playing').forEach(b => b.classList.remove('playing'));
    const audio = new Audio(`sounds/${letter.toLowerCase()}.mp3`);
    btn.classList.add('playing');
    letterStatus.textContent = `🔊 ${letter}`;
    audio.play();
    audio.onended = () => { btn.classList.remove('playing'); letterStatus.textContent = ''; };
    audio.onerror = () => { btn.classList.remove('playing'); letterStatus.textContent = '⚠️'; };
  });
  letterGrid.appendChild(btn);
}

// ─── Word Reading (Web Speech API) ─────────────────
const wordInput = document.getElementById('wordInput');
const speakBtn = document.getElementById('speakBtn');
const wordStatus = document.getElementById('wordStatus');

function speakWord() {
  const word = wordInput.value.trim();
  if (!word || !/^[A-Za-z]+$/.test(word)) return;
  
  wordStatus.textContent = `📖 "${word}"`;
  const utter = new SpeechSynthesisUtterance(word.toLowerCase());
  utter.lang = 'en-GB';
  utter.rate = 0.8;
  if (ukVoice) utter.voice = ukVoice;
  
  utter.onend = () => { wordStatus.textContent = ''; };
  utter.onerror = () => { wordStatus.textContent = '⚠️ TTS error'; };
  
  speechSynthesis.cancel(); // stop any previous
  speechSynthesis.speak(utter);
}

speakBtn.addEventListener('click', speakWord);
wordInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') speakWord();
});
</script>
</body>
</html>
