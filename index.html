<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌈 Phonics Fun — 拼音練習</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
  background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ff9a9e 100%);
  min-height: 100vh;
  padding: 20px;
}
.container { max-width: 900px; margin: 0 auto; }

h1 {
  text-align: center;
  font-size: 2.5em;
  color: #6b35b3;
  text-shadow: 2px 2px 0 #ffd700;
  margin-bottom: 10px;
}
.subtitle { text-align: center; font-size: 1.2em; color: #555; margin-bottom: 20px; }

.section {
  background: rgba(255,255,255,0.9);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}
.section h2 {
  color: #e84393;
  margin-bottom: 15px;
  font-size: 1.5em;
}

/* Letter grid */
.letter-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
  gap: 10px;
}
.letter-btn {
  aspect-ratio: 1;
  border: 3px solid #ddd;
  border-radius: 15px;
  background: linear-gradient(145deg, #fff, #f0f0f0);
  font-size: 1.6em;
  font-weight: bold;
  color: #333;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 3px 6px rgba(0,0,0,0.1);
}
.letter-btn:hover { transform: scale(1.1); border-color: #ff6b6b; }
.letter-btn:active { transform: scale(0.95); background: #ffeaa7; }
.letter-btn.playing { background: #ffd700; border-color: #ff6b6b; transform: scale(1.15); }
.letter-btn.vowel { background: linear-gradient(145deg, #ffe0f0, #ffd0e0); }

/* Letter colors */
.letter-a,.letter-e,.letter-i,.letter-o,.letter-u { color: #e84393; }

/* Blending section */
.blend-row {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.blend-input {
  flex: 1;
  min-width: 200px;
  padding: 12px 16px;
  font-size: 1.4em;
  border: 3px solid #ddd;
  border-radius: 12px;
  outline: none;
  text-transform: uppercase;
  text-align: center;
  letter-spacing: 2px;
}
.blend-input:focus { border-color: #6c5ce7; }
.blend-btn {
  padding: 12px 30px;
  font-size: 1.3em;
  font-weight: bold;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #6c5ce7, #a29bfe);
  color: white;
  cursor: pointer;
  box-shadow: 0 3px 8px rgba(0,0,0,0.15);
  transition: all 0.15s;
}
.blend-btn:hover { transform: scale(1.05); }
.blend-btn:active { transform: scale(0.97); }
.blend-btn.playing { background: linear-gradient(135deg, #fd79a8, #e84393); }

.letter-display {
  display: flex;
  gap: 8px;
  margin: 15px 0;
  flex-wrap: wrap;
  justify-content: center;
}
.letter-chip {
  background: #ffeaa7;
  border: 2px solid #fdcb6e;
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 1.3em;
  font-weight: bold;
  color: #6b35b3;
}
.letter-chip.active { background: #ffd700; border-color: #ff6b6b; transform: scale(1.15); }
.arrow { font-size: 1.5em; color: #6c5ce7; }
.result-word {
  text-align: center;
  font-size: 2em;
  font-weight: bold;
  color: #00b894;
  margin-top: 10px;
}

/* Speed toggle */
.speed-row {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin: 10px 0;
  flex-wrap: wrap;
}
.speed-btn {
  padding: 8px 16px;
  border: 2px solid #ddd;
  border-radius: 8px;
  background: #fff;
  font-size: 1em;
  cursor: pointer;
  transition: all 0.15s;
}
.speed-btn.active { background: #6c5ce7; color: white; border-color: #6c5ce7; }

/* Status */
.status {
  text-align: center;
  color: #888;
  font-size: 0.9em;
  margin-top: 10px;
}

/* Responsive */
@media (max-width: 500px) {
  h1 { font-size: 1.8em; }
  .letter-grid { grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px; }
  .letter-btn { font-size: 1.3em; border-radius: 10px; }
}
</style>
</head>
<body>
<div class="container">

<h1>🌈 Phonics Fun</h1>
<p class="subtitle">撳字母聽發音 · 輸入詞語學拼讀</p>

<!-- Letter Sounds -->
<div class="section">
  <h2>🔤 單個字母發音</h2>
  <div class="letter-grid" id="letterGrid">
    <!-- Generated by JS -->
  </div>
  <p class="status" id="letterStatus">撳任何字母聽發音 🔊</p>
</div>

<!-- Blending -->
<div class="section">
  <h2>🔗 拼讀練習 (Blending)</h2>
  <div class="speed-row">
    <span style="line-height:2.2;color:#666;">語速:</span>
    <button class="speed-btn" data-speed="0.8">🐢 慢</button>
    <button class="speed-btn active" data-speed="1.0">🚶 正常</button>
    <button class="speed-btn" data-speed="1.3">🐇 快</button>
  </div>
  <div class="blend-row">
    <input type="text" class="blend-input" id="blendInput" placeholder="輸入英文詞語, e.g. CAT" maxlength="15">
    <button class="blend-btn" id="blendBtn">🔊 拼讀</button>
  </div>
  <div class="letter-display" id="letterDisplay"></div>
  <div class="result-word" id="resultWord"></div>
  <p class="status" id="blendStatus">試下輸入 CAT / DOG / FISH</p>
</div>

</div>

<script>
// ─── Phonics sound map ─────────────────────────────
const phonicsSounds = {
  'A': 'ah', 'B': 'buh', 'C': 'kuh', 'D': 'duh',
  'E': 'eh', 'F': 'fff', 'G': 'guh', 'H': 'hhh',
  'I': 'ih', 'J': 'juh', 'K': 'kuh', 'L': 'lll',
  'M': 'mmm', 'N': 'nnn', 'O': 'oh', 'P': 'puh',
  'Q': 'kw', 'R': 'rrr', 'S': 'sss', 'T': 'tuh',
  'U': 'uh', 'V': 'vvv', 'W': 'wuh', 'X': 'ks',
  'Y': 'yuh', 'Z': 'zzz'
};

// ─── Speed ─────────────────────────────────────────
let speed = 1.0;
document.querySelectorAll('.speed-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    speed = parseFloat(btn.dataset.speed);
  });
});

// ─── Speech ────────────────────────────────────────
const synth = window.speechSynthesis;
let speaking = false;

function speak(text, rate = 1.0) {
  return new Promise((resolve) => {
    synth.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = rate * speed;
    utter.pitch = 1.1;
    utter.volume = 1;
    utter.onend = resolve;
    utter.onerror = resolve;
    synth.speak(utter);
  });
}

// ─── Letter Grid ───────────────────────────────────
const grid = document.getElementById('gridLetter');
const vowels = new Set(['A','E','I','O','U']);
const letterGrid = document.getElementById('letterGrid');
const letterStatus = document.getElementById('letterStatus');

for (const letter of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') {
  const btn = document.createElement('button');
  btn.className = 'letter-btn';
  if (vowels.has(letter)) btn.classList.add('vowel');
  btn.textContent = letter;
  btn.addEventListener('click', async () => {
    if (speaking) return;
    speaking = true;
    btn.classList.add('playing');
    letterStatus.textContent = `🔊 ${letter} 發音: /${phonicsSounds[letter]}/`;
    await speak(phonicsSounds[letter], 0.7);
    btn.classList.remove('playing');
    letterStatus.textContent = '撳任何字母聽發音 🔊';
    speaking = false;
  });
  letterGrid.appendChild(btn);
}

// ─── Blending ──────────────────────────────────────
const blendInput = document.getElementById('blendInput');
const blendBtn = document.getElementById('blendBtn');
const letterDisplay = document.getElementById('letterDisplay');
const resultWord = document.getElementById('resultWord');
const blendStatus = document.getElementById('blendStatus');

function isValidWord(str) {
  return /^[A-Za-z]+$/.test(str);
}

blendInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') blendBtn.click();
});

blendBtn.addEventListener('click', async () => {
  const word = blendInput.value.trim().toUpperCase();
  if (!word) { blendStatus.textContent = '請輸入一個英文詞語'; return; }
  if (!isValidWord(word)) { blendStatus.textContent = '只可以輸入英文字母 A-Z'; return; }
  if (speaking) { blendStatus.textContent = '請等讀完再試'; return; }

  speaking = true;
  blendBtn.classList.add('playing');
  letterDisplay.innerHTML = '';
  resultWord.textContent = '';

  // Show letter chips
  const letters = word.split('');
  letters.forEach(l => {
    const chip = document.createElement('span');
    chip.className = 'letter-chip';
    chip.textContent = l;
    chip.id = 'chip-' + l + '-' + Math.random().toString(36).slice(2,6);
    letterDisplay.appendChild(chip);
  });

  // Step 1: Read each letter's phonics sound
  blendStatus.textContent = '🔊 逐個字母發音...';
  for (let i = 0; i < letters.length; i++) {
    const chip = letterDisplay.children[i];
    chip.classList.add('active');
    await speak(phonicsSounds[letters[i]], 0.6);
    chip.classList.remove('active');
    // Small pause between letters
    if (i < letters.length - 1) {
      await new Promise(r => setTimeout(r, 300 / speed));
    }
  }

  // Step 2: Blend them together
  await new Promise(r => setTimeout(r, 600 / speed));
  blendStatus.textContent = '🔗 拼讀中...';
  resultWord.textContent = word;
  // Blend: speak each sound in sequence with decreasing gaps
  const blendText = letters.map(l => phonicsSounds[l]).join(' ');
  await speak(blendText, 0.5);

  // Step 3: Say the full word
  await new Promise(r => setTimeout(r, 400 / speed));
  blendStatus.textContent = '📖 完整讀出:';
  await speak(word, 0.8);

  blendStatus.textContent = `✅ 完成！「${word}」`;
  blendBtn.classList.remove('playing');
  speaking = false;
});

// ─── Keyboard shortcuts ────────────────────────────
document.addEventListener('keydown', (e) => {
  // Don't trigger when focused on input
  if (document.activeElement === blendInput) return;
  const key = e.key.toUpperCase();
  if (key >= 'A' && key <= 'Z') {
    const btn = Array.from(letterGrid.children).find(b => b.textContent === key);
    if (btn) btn.click();
  }
});

// ─── Init ──────────────────────────────────────────
blendInput.focus();
</script>
</body>
</html>
