<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌈 Phonics Fun — 拼音練習</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
  background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ff9a9e 100%);
  min-height: 100vh;
  padding: 20px;
}
.container { max-width: 900px; margin: 0 auto; }
h1 { text-align: center; font-size: 2.5em; color: #6b35b3; text-shadow: 2px 2px 0 #ffd700; margin-bottom: 10px; }
.subtitle { text-align: center; font-size: 1.2em; color: #555; margin-bottom: 20px; }
.section { background: rgba(255,255,255,0.9); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
.section h2 { color: #e84393; margin-bottom: 15px; font-size: 1.5em; }

.letter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 10px; }
.letter-btn { aspect-ratio: 1; border: 3px solid #ddd; border-radius: 15px; background: linear-gradient(145deg, #fff, #f0f0f0); font-size: 1.6em; font-weight: bold; color: #333; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
.letter-btn:hover { transform: scale(1.1); border-color: #ff6b6b; }
.letter-btn:active { transform: scale(0.95); background: #ffeaa7; }
.letter-btn.playing { background: #ffd700; border-color: #ff6b6b; transform: scale(1.15); }
.letter-btn.vowel { background: linear-gradient(145deg, #ffe0f0, #ffd0e0); color: #e84393; }

.word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; }
.word-btn { padding: 14px 8px; border: 3px solid #a29bfe; border-radius: 12px; background: linear-gradient(145deg, #fff, #f0e8ff); font-size: 1.3em; font-weight: bold; color: #6b35b3; cursor: pointer; transition: all 0.15s; text-align: center; text-transform: uppercase; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
.word-btn:hover { transform: scale(1.08); border-color: #6c5ce7; background: #dfe6fd; }
.word-btn:active { transform: scale(0.95); background: #a29bfe; color: #fff; }
.word-btn.playing { background: #6c5ce7; color: #fff; border-color: #4a3db7; }

.custom-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 15px; }
.custom-input { flex: 1; min-width: 200px; padding: 12px 16px; font-size: 1.4em; border: 3px solid #a29bfe; border-radius: 12px; outline: none; text-transform: lowercase; text-align: center; }
.read-btn { padding: 12px 28px; background: #00b894; color: white; border: none; border-radius: 12px; font-size: 1.3em; font-weight: bold; cursor: pointer; transition: all 0.15s; box-shadow: 0 3px 6px rgba(0,0,0,0.15); }
.read-btn:hover { background: #00a381; transform: scale(1.05); }
.read-btn:active { background: #008966; transform: scale(0.95); }

.status { text-align: center; color: #888; font-size: 0.9em; margin-top: 10px; min-height: 20px; }
.source-tag { text-align: center; color: #aaa; font-size: 0.75em; margin-top: 5px; }
</style>
</head>
<body>
<div class="container">

<h1>🌈 Phonics Fun</h1>
<p class="subtitle">撳字母聽發音 · UK男聲讀字 <span style="color:#aaa;font-size:0.65em;">🇬🇧 v8.0</span></p>

<!-- Letter Sounds -->
<div class="section">
  <h2>🔤 字母發音</h2>
  <div class="letter-grid" id="letterGrid"></div>
  <div class="status" id="letterStatus"></div>
</div>

<!-- Whole Words -->
<div class="section">
  <h2>📖 讀字 (UK男聲)</h2>
  <div class="word-grid" id="wordGrid"></div>
  <div class="custom-row">
    <input type="text" class="custom-input" id="customInput" placeholder="自訂詞語, e.g. butterfly" maxlength="30">
    <button class="read-btn" id="customReadBtn">🔊 讀字</button>
  </div>
  <div class="status" id="wordStatus"></div>
  <div class="source-tag">真人錄音: 🇬🇧 Ryan (Microsoft Neural) · 自訂: Browser UK TTS</div>
</div>

</div>

<script>
const vowels = new Set(['A','E','I','O','U']);

// ─── Pre-generated UK male words (edge-tts en-GB-RyanNeural) ───
const preWords = ["cat","dog","sit","tap","red","big","fun","hat","jam","kid","leg","man","not","pen","run","sun","top","van","wet","yes","zip","bed","cup","fox","get","hop","lip","mud","nap","pig","rat","sad"];

// ─── Letter Grid ───────────────────────────────────
const letterGrid = document.getElementById('letterGrid');
const letterStatus = document.getElementById('letterStatus');

for (let i = 0; i < 26; i++) {
  const letter = String.fromCharCode(65 + i);
  const btn = document.createElement('button');
  btn.className = 'letter-btn' + (vowels.has(letter) ? ' vowel' : '');
  btn.textContent = letter;
  btn.addEventListener('click', () => {
    playLetter(letter, btn);
  });
  letterGrid.appendChild(btn);
}

function playLetter(letter, btn) {
  document.querySelectorAll('.playing').forEach(b => b.classList.remove('playing'));
  const audio = new Audio(`sounds/${letter.toLowerCase()}.mp3`);
  btn.classList.add('playing');
  letterStatus.textContent = `🔊 ${letter}`;
  audio.play();
  audio.onended = () => {
    btn.classList.remove('playing');
    letterStatus.textContent = '';
  };
  audio.onerror = () => {
    btn.classList.remove('playing');
    letterStatus.textContent = '⚠️ 錄音未載入';
  };
}

// ─── Word Grid + Custom Input ───────────────────────
const wordGrid = document.getElementById('wordGrid');
const wordStatus = document.getElementById('wordStatus');
const customInput = document.getElementById('customInput');
const customReadBtn = document.getElementById('customReadBtn');

// Build word buttons
for (const w of preWords) {
  const btn = document.createElement('button');
  btn.className = 'word-btn';
  btn.textContent = w;
  btn.addEventListener('click', () => readWord(w, btn));
  wordGrid.appendChild(btn);
}

// Custom word button
customReadBtn.addEventListener('click', () => {
  const word = customInput.value.trim().toLowerCase();
  if (!word || !/^[a-z]+$/.test(word)) return;
  readCustom(word);
});
customInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const word = customInput.value.trim().toLowerCase();
    if (word && /^[a-z]+$/.test(word)) readCustom(word);
  }
});

function readWord(word, btn) {
  document.querySelectorAll('.playing').forEach(b => b.classList.remove('playing'));
  if (btn) btn.classList.add('playing');
  wordStatus.textContent = `📖 "${word}"`;
  const audio = new Audio(`sounds/words/${word}.mp3`);
  audio.play();
  audio.onended = () => {
    if (btn) btn.classList.remove('playing');
    wordStatus.textContent = '';
  };
  audio.onerror = () => {
    // Fallback to browser TTS
    readCustom(word);
    if (btn) btn.classList.remove('playing');
  };
}

function readCustom(word) {
  document.querySelectorAll('.playing').forEach(b => b.classList.remove('playing'));
  wordStatus.textContent = `📖 "${word}" (TTS)`;
  const utter = new SpeechSynthesisUtterance(word);
  utter.lang = 'en-GB';
  utter.rate = 0.85;
  // Try to select a UK male voice
  const voices = speechSynthesis.getVoices();
  const ukMale = voices.find(v => v.lang.startsWith('en-GB') && v.name.toLowerCase().includes('male')) ||
                 voices.find(v => v.lang.startsWith('en-GB'));
  if (ukMale) utter.voice = ukMale;
  utter.onend = () => { wordStatus.textContent = ''; };
  speechSynthesis.speak(utter);
}

// Pre-load voices
speechSynthesis.getVoices();
speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
</script>
</body>
</html>
